<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>File Converter</title>
<style>
  :root {
    --accent:#6d4aff; --accent-soft:rgba(109,74,255,.16);
    --fg:#ece9f7; --muted:#8d88a5; --danger:#ff6d6d;
    --pane:rgba(255,255,255,.05); --pane-hover:rgba(255,255,255,.09);
    --border:rgba(255,255,255,.08);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    height:100vh; display:flex; flex-direction:column; gap:12px; padding:14px;
    color:var(--fg); font-family:'Segoe UI',system-ui,sans-serif;
    background:
      radial-gradient(700px 420px at 90% -10%, rgba(109,74,255,.16), transparent 60%),
      #131118;
  }
  #drop {
    border:2px dashed var(--border); border-radius:14px; padding:26px 14px;
    text-align:center; color:var(--muted); transition:.15s;
  }
  #drop.over { border-color:var(--accent); color:var(--fg); background:var(--accent-soft); }
  #file { display:none; }
  label.btn, select, .mini {
    padding:9px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--pane); color:var(--fg); font-size:13px; cursor:pointer; outline:none;
  }
  label.btn:hover { background:var(--pane-hover); }
  .mini { border:none; background:var(--accent); color:#fff; }
  #status { font-size:12px; color:var(--muted); min-height:16px; }
  #status.err { color:var(--danger); }
  #result {
    flex:1; border-radius:12px; border:1px solid var(--border);
    background:var(--pane); padding:10px;
    font-family:ui-monospace,monospace; font-size:11px; overflow:auto;
    white-space:pre-wrap; word-break:break-all; color:var(--muted);
  }
</style>
</head>
<body>
  <div id="drop">Drop a file here<br>or
    <label class="btn">browse<input id="file" type="file"></label>
  </div>
  <div class="controls" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
    <select id="mode">
      <option value="csv2json">CSV → JSON</option>
      <option value="json2csv">JSON → CSV</option>
      <option value="json2min">JSON → minified</option>
      <option value="json2pretty">JSON → pretty</option>
      <option value="md2html">Markdown → HTML</option>
      <option value="b64encode">Any file → Base64</option>
      <option value="b64decode">Base64 → decoded file</option>
    </select>
    <button class="mini" id="convert">Convert</button>
    <button class="mini" id="save" disabled>Save result…</button>
    <button class="mini" id="copy" disabled>Copy</button>
  </div>
  <div id="status"></div>
  <div id="result">Result preview appears here.</div>

<script>
  const drop = document.getElementById('drop');
  const fileIn = document.getElementById('file');
  const modeEl = document.getElementById('mode');
  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');
  let pending = null, fileData = null, fileName = '';

  if (!window.pwpage) { statusEl.textContent = 'Bridge unavailable'; statusEl.className = 'err'; }

  function setFile(f) {
    fileName = f.name;
    const reader = new FileReader();
    reader.onload = () => { fileData = reader.result.split(',')[1]; setStatus(fileName + ' ready (' + f.size + ' bytes)'); };
    reader.readAsDataURL(f);
  }
  fileIn.addEventListener('change', () => fileIn.files[0] && setFile(fileIn.files[0]));
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => {
    e.preventDefault(); drop.classList.remove('over');
    if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
  });

  function setStatus(t, err) { statusEl.textContent = t; statusEl.className = err ? 'err' : ''; }

  document.getElementById('convert').onclick = async () => {
    if (!fileData) { setStatus('Pick a file first.', true); return; }
    setStatus('Converting…');
    const r = await window.pwpage.convert({ mode: modeEl.value, name: fileName, data: fileData });
    if (!r.ok) { setStatus(r.error, true); return; }
    pending = r;
    try {
      resultEl.textContent = decodeURIComponent(escape(atob(r.contentBase64))).slice(0, 4000) || '(binary result — use Save)';
    } catch (_) {
      resultEl.textContent = '(binary result — use Save)';
    }
    document.getElementById('save').disabled = false;
    document.getElementById('copy').disabled = false;
    setStatus('Done → ' + r.name);
  };
  document.getElementById('save').onclick = async () => {
    if (!pending) return;
    const r = await window.pwpage.convertSave({ name: pending.name, contentBase64: pending.contentBase64 });
    setStatus(r.canceled ? 'Save canceled.' : r.ok ? 'Saved!' : 'Save failed.');
  };
  document.getElementById('copy').onclick = async () => {
    if (!pending) return;
    try { await navigator.clipboard.writeText(decodeURIComponent(escape(atob(pending.contentBase64)))); setStatus('Copied to clipboard.'); }
    catch (_) { setStatus('Copy failed (binary content) — use Save instead.', true); }
  };
</script>
</body>
</html>
