<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>New Tab</title>
<link rel="icon" href="icons/browser.png">
<style>
  :root {
    --accent:#6d4aff; --accent-soft:rgba(109,74,255,.18);
    --fg:#ece9f7; --muted:#8d88a5;
    --glass:rgba(30,27,42,.72); --glass-strong:rgba(34,30,48,.88);
    --border:rgba(255,255,255,.08);
    --wa:0.88;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:#131118; color:var(--fg);
    font-family:'Segoe UI',system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    overflow-y:auto; position:relative;
  }
  #bg-layer { position:fixed; inset:0; z-index:0; background-size:cover; background-position:center; }
  #bg-dim   { position:fixed; inset:0; z-index:1; background:rgba(13,12,18,.62); }
  .content { position:relative; z-index:2; width:100%; max-width:1100px;
             padding:7vh 24px 90px; display:flex; flex-direction:column; align-items:center; }

  .hero { text-align:center; margin-bottom:24px; }
  .hero h1 { font-size:66px; font-weight:800; letter-spacing:-2px; }
  .hero h1 span { color:var(--accent); }
  .hero .tagline { color:var(--muted); font-size:15px; margin-top:2px; }

  .search { display:flex; width:min(680px,100%); margin:24px auto 0; }
  .search input {
    flex:1; height:60px; padding:0 28px; font-size:18px;
    border-radius:30px 0 0 30px; border:2px solid var(--border);
    background:var(--glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    color:var(--fg); outline:none;
  }
  .search input:focus { border-color:var(--accent); }
  .search button {
    height:60px; padding:0 34px; border:none; cursor:pointer;
    border-radius:0 30px 30px 0; background:var(--accent); color:#fff;
    font-size:17px; font-weight:600;
  }
  .engine-hint { color:var(--muted); font-size:13px; margin-top:10px; }
  .engine-hint b { color:var(--fg); }

  .quick { display:flex; gap:12px; margin:22px 0 8px; flex-wrap:wrap; justify-content:center; }
  .quick a {
    display:flex; flex-direction:column; align-items:center; gap:7px;
    width:84px; padding:14px 6px; text-decoration:none; color:var(--fg);
    background:rgba(30,27,42,var(--wa));
    border:1px solid var(--border); border-radius:14px; font-size:12px;
  }
  .quick a:hover { border-color:var(--accent); }
  .quick img { width:32px; height:32px; border-radius:8px; }
  .quick .glyph { font-size:24px; line-height:32px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:18px; width:100%; margin-top:26px; }
  .widget {
    background:rgba(30,27,42,var(--wa));
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--border); border-radius:18px; padding:22px;
  }
  .widget h3 { font-size:13px; color:var(--muted); text-transform:uppercase;
    letter-spacing:1.5px; margin-bottom:14px; }
  .stat-big { font-size:52px; font-weight:800; color:var(--accent); line-height:1; }
  .stat-sub { color:var(--muted); font-size:13px; margin-top:8px; }
  .wx-temp { font-size:52px; font-weight:800; line-height:1; }
  .wx-meta { color:var(--muted); font-size:14px; margin-top:10px; line-height:1.7; }
  #city-form { display:flex; gap:8px; margin-top:14px; }
  #city-input {
    flex:1; padding:9px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--pane, rgba(255,255,255,.05)); color:var(--fg); outline:none; font-size:13px;
  }
  #city-input:focus { border-color:var(--accent); }
  #city-form button { padding:9px 16px; border:none; border-radius:10px;
    background:var(--accent); color:#fff; cursor:pointer; font-size:13px; }
  .news-item { padding:10px 0; border-bottom:1px solid var(--border); font-size:14px; line-height:1.5; }
  .news-item:last-child { border-bottom:none; }
  .news-item a { color:var(--fg); text-decoration:none; }
  .news-item a:hover { color:var(--accent); }

  .big-clock { text-align:center; margin-bottom:6px; }
  #clock { font-size:44px; font-weight:700; letter-spacing:1px; }
  #date { color:var(--muted); font-size:14px; margin-top:4px; }

  #bg-controls {
    position:fixed; bottom:14px; right:16px; z-index:3;
    display:flex; gap:8px; align-items:center;
    background:rgba(34,30,48,.9); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--border); padding:8px 10px; border-radius:12px;
  }
  #bg-controls.collapsed .ctl { display:none; }
  #bg-controls input[type=text] { width:190px; padding:7px 10px; border-radius:8px;
    border:1px solid var(--border); background:rgba(255,255,255,.05); color:var(--fg);
    outline:none; font-size:12px; }
  #bg-controls button, #bg-controls label { padding:7px 12px; border:none; border-radius:8px;
    background:rgba(255,255,255,.06); color:var(--fg); cursor:pointer; font-size:12px; }
  #bg-controls button:hover, #bg-controls label:hover { background:var(--accent); color:#fff; }
  #bg-controls .ctl-row { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  #wa-slider { width:120px; accent-color:var(--accent); }
  #bg-toggle { background:var(--accent) !important; color:#fff !important; }
  #bg-file { display:none; }
</style>
</head>
<body>
  <div id="bg-layer"></div>
  <div id="bg-dim"></div>

  <div class="content">
    <div class="hero">
      <h1>Purple<span>Wren</span></h1>
      <div class="tagline">Private by default. Powered by Startpage.</div>
      <form class="search" id="search-form">
        <input id="search-input" type="text" placeholder="Search the web privately…" autofocus>
        <button type="submit">Search</button>
      </form>
      <div class="engine-hint">Engine: <b id="engine-name">Startpage</b> · <a href="#" id="open-settings" style="color:inherit;text-decoration:underline;">change in ⚙ Settings</a></div>
    </div>

    <div class="big-clock">
      <div id="clock">--:--</div>
      <div id="date"></div>
    </div>

    <div class="quick">
      <a href="#" data-url="https://mail.proton.me" data-icon="https://mail.proton.me/favicon.ico"><span class="glyph">✉</span>Mail</a>
      <a href="#" data-url="https://docs.proton.me" data-icon="https://docs.proton.me/favicon.ico"><span class="glyph">📄</span>Docs</a>
      <a href="#" data-url="https://drive.proton.me" data-icon="https://drive.proton.me/favicon.ico"><span class="glyph">☁</span>Drive</a>
      <a href="#" data-url="https://www.startpage.com" data-icon="https://www.startpage.com/favicon.ico"><span class="glyph">🔍</span>Startpage</a>
      <a href="#" data-url="https://lumo.proton.me" data-icon="https://lumo.proton.me/favicon.ico"><span class="glyph">◆</span>Lumo</a>
    </div>

    <div class="grid">
      <div class="widget">
        <h3>🛡 Privacy statistics</h3>
        <div class="stat-big" id="stat-blocked">0</div>
        <div class="stat-sub">Trackers &amp; ads blocked this session</div>
        <div class="stat-sub" id="stat-total"></div>
      </div>
      <div class="widget">
        <h3>🌤 Weather</h3>
        <div class="wx-temp" id="wx-temp">…</div>
        <div class="wx-meta" id="wx-meta">Loading</div>
        <form id="city-form">
          <input id="city-input" type="text" placeholder="Change city…">
          <button type="submit">Set</button>
        </form>
      </div>
      <div class="widget">
        <h3>📰 World news</h3>
        <div id="news-list">Loading…</div>
      </div>
    </div>
  </div>

  <div id="bg-controls" class="collapsed">
    <button id="bg-toggle" title="Show/hide panel">⚙</button>
    <input id="bg-url" class="ctl" type="text" placeholder="Image URL…">
    <button id="bg-url-set" class="ctl">Set URL</button>
    <label class="ctl">Browse…<input id="bg-file" type="file" accept="image/*"></label>
    <button id="bg-reset" class="ctl">Reset</button>
    <div class="ctl-row ctl">Widget opacity
      <input id="wa-slider" type="range" min="20" max="100" value="88">
    </div>
  </div>

<script>
  /* ---------- search ---------- */
  const ENGINE_LABELS = { startpage:'Startpage', duckduckgo:'DuckDuckGo', brave:'Brave Search', google:'Google' };
  const ENGINE_URLS = {
    startpage:  q => 'https://www.startpage.com/sp/search?query=' + encodeURIComponent(q),
    duckduckgo: q => 'https://duckduckgo.com/?q=' + encodeURIComponent(q),
    brave:      q => 'https://search.brave.com/search?q=' + encodeURIComponent(q),
    google:     q => 'https://www.google.com/search?q=' + encodeURIComponent(q)
  };
  document.getElementById('search-form').addEventListener('submit', async e => {
    e.preventDefault();
    const q = document.getElementById('search-input').value.trim();
    if (!q) return;
    const s = await window.pwpage.settings();
    location.href = (ENGINE_URLS[s.searchEngine] || ENGINE_URLS.startpage)(q);
  });
  (async () => {
    try {
      const s = await window.pwpage.settings();
      document.getElementById('engine-name').textContent = ENGINE_LABELS[s.searchEngine] || 'Startpage';
    } catch (_) {}
  })();

  /* ---------- quick links with official favicons ---------- */
  document.querySelectorAll('.quick a').forEach(a => {
    a.addEventListener('click', e => { e.preventDefault(); location.href = a.dataset.url; });
    const img = document.createElement('img');
    img.alt = '';
    img.onload  = () => { const g = a.querySelector('.glyph'); if (g) g.replaceWith(img); };
    img.onerror = () => img.remove();
    img.src = a.dataset.icon;
  });

  /* ---------- clock ---------- */
  function tickClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
    document.getElementById('date').textContent =
      now.toLocaleDateString([], { weekday:'long', month:'long', day:'numeric' });
  }
  tickClock(); setInterval(tickClock, 1000);

  /* ---------- stats ---------- */
  (async () => {
    try {
      const stats = await window.pwpage.stats();
      document.getElementById('stat-blocked').textContent = Number(stats.blocked).toLocaleString();
      document.getElementById('stat-total').textContent =
        Number(stats.requests).toLocaleString() + ' total requests seen this session';
    } catch (_) {}
  })();

  /* ---------- weather ---------- */
  async function loadWeather(city) {
    const w = await window.pwpage.weather(city);
    if (w.error) { document.getElementById('wx-meta').textContent = w.error; return; }
    document.getElementById('wx-temp').textContent = Math.round(w.temp) + '°C';
    document.getElementById('wx-meta').innerHTML =
      w.city + (w.country ? ', ' + w.country : '') + '<br>' +
      '↑' + Math.round(w.max) + '° / ↓' + Math.round(w.min) + '° · 💨 ' + Math.round(w.wind) + ' km/h';
  }
  loadWeather();
  document.getElementById('city-form').addEventListener('submit', e => {
    e.preventDefault();
    const c = document.getElementById('city-input').value.trim();
    if (c) { loadWeather(c); document.getElementById('city-input').value = ''; }
  });

  /* ---------- news ---------- */
  (async () => {
    const el = document.getElementById('news-list');
    try {
      const r = await window.pwpage.news();
      if (r.error) { el.textContent = 'News unavailable: ' + r.error; return; }
      const doc = new DOMParser().parseFromString(r.xml, 'text/xml');
      const items = [...doc.querySelectorAll('item')].slice(0, 7);
      el.innerHTML = '';
      for (const it of items) {
        const d = document.createElement('div');
        d.className = 'news-item';
        const a = document.createElement('a');
        a.href = it.querySelector('link')?.textContent || '#';
        a.textContent = it.querySelector('title')?.textContent || '';
        a.target = '_blank';
        d.appendChild(a);
        el.appendChild(d);
      }
      if (!items.length) el.textContent = 'No stories loaded.';
    } catch (e) { el.textContent = 'News unavailable.'; }
  })();

  /* ---------- custom background ---------- */
  const bgLayer = document.getElementById('bg-layer');
  function applyBg(value) {
    if (value) {
      bgLayer.style.backgroundImage = 'url("' + value + '")';
      localStorage.setItem('pw-bg', value);
    } else {
      bgLayer.style.backgroundImage = '';
      localStorage.removeItem('pw-bg');
    }
  }
  applyBg(localStorage.getItem('pw-bg'));

  /* ---------- widget opacity ---------- */
  const root = document.documentElement;
  function applyWa(v) {
    root.style.setProperty('--wa', (v / 100).toFixed(2));
    localStorage.setItem('pw-wa', v);
  }
  applyWa(Number(localStorage.getItem('pw-wa')) || 88);
  const waSlider = document.getElementById('wa-slider');
  waSlider.value = Number(localStorage.getItem('pw-wa')) || 88;
  waSlider.addEventListener('input', () => applyWa(Number(waSlider.value)));

  /* ---------- collapsible controls ---------- */
  document.getElementById('bg-toggle').addEventListener('click', () =>
    document.getElementById('bg-controls').classList.toggle('collapsed'));
  document.getElementById('bg-url-set').addEventListener('click', () => {
    const u = document.getElementById('bg-url').value.trim();
    if (u) applyBg(u);
  });
  document.getElementById('bg-url').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('bg-url-set').click(); }
  });
  document.getElementById('bg-file').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    if (f.size > 4 * 1024 * 1024) { alert('Image too large (keep under 4 MB)'); return; }
    const reader = new FileReader();
    reader.onload = () => applyBg(reader.result);
    reader.readAsDataURL(f);
  });
  document.getElementById('bg-reset').addEventListener('click', () => applyBg(null));

  /* ---------- settings shortcut ---------- */
  document.getElementById('open-settings').addEventListener('click', e => {
    e.preventDefault();
    if (window.pwpage) window.pwpage.requestSettings();
  });
</script>
</body>
</html>
