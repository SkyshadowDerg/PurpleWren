<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WrenMaps</title>
<link rel="icon" href="icons/maps.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --accent:#6d4aff; --bg:#16151d; --bg2:#1f1d2b; --bg3:#2a2738; --fg:#ece9f7; --muted:#8d88a5; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { display:flex; height:100vh; background:var(--bg); color:var(--fg); font-family:'Segoe UI',system-ui,sans-serif; }
  #sidebar { width:300px; padding:16px; background:var(--bg2); border-right:1px solid var(--bg3); display:flex; flex-direction:column; gap:10px; }
  #sidebar h1 { font-size:20px; } #sidebar h1 span { color:var(--accent); }
  #search { display:flex; gap:6px; }
  #place { flex:1; padding:9px 12px; border-radius:10px; border:1px solid var(--bg3); background:var(--bg3); color:var(--fg); outline:none; font-size:13px; }
  #search button, #ask-lumo { padding:9px 14px; border:none; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; font-size:13px; }
  #ask-lumo { background:var(--bg3); }
  #ask-lumo:hover { background:var(--accent); }
  #place-info { font-size:13px; color:var(--muted); line-height:1.6; overflow-y:auto; flex:1; }
  #place-info b { color:var(--fg); }
  #map { flex:1; }
  .leaflet-container { background:#0d0c12; }
</style>
</head>
<body>
  <div id="sidebar">
    <h1>Wren<span>Maps</span></h1>
    <div id="search">
      <input id="place" type="text" placeholder="Search a place…">
      <button id="go">Go</button>
    </div>
    <button id="ask-lumo">◆ Ask Lumo about this place</button>
    <div id="place-info">Map data © OpenStreetMap contributors. Search above, or just pan the map.</div>
  </div>
  <div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([51.505, -0.09], 12);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
    subdomains: 'abcd', maxZoom: 19
  }).addTo(map);
  let marker = null, current = null;

  async function search(q) {
    const info = document.getElementById('place-info');
    info.textContent = 'Searching…';
    try {
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q));
      const j = await r.json();
      if (!j.length) { info.textContent = 'Place not found.'; return; }
      const p = j[0];
      current = { name: p.display_name, lat: p.lat, lon: p.lon };
      map.setView([+p.lat, +p.lon], 14);
      if (marker) marker.remove();
      marker = L.marker([+p.lat, +p.lon]).addTo(map);
      info.innerHTML = '<b>' + esc(p.display_name) + '</b><br><br>' +
        'Lat ' + (+p.lat).toFixed(4) + ' · Lon ' + (+p.lon).toFixed(4);
    } catch (e) { info.textContent = 'Search failed — check connection (or disable strict blocking for map tiles).'; }
  }
  function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  document.getElementById('go').addEventListener('click', () => {
    const q = document.getElementById('place').value.trim();
    if (q) search(q);
  });
  document.getElementById('place').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('go').click(); }
  });
  document.getElementById('ask-lumo').addEventListener('click', () => {
    if (!current) return;
    if (window.pwpage) window.pwpage.askLumo(current.name);
    document.getElementById('place-info').innerHTML =
      '<b>Asked Lumo:</b><br>' + esc(current.name) +
      '<br><br>Switch to the Lumo dock (◆ button or Ctrl+J) to see the conversation.';
  });
</script>
</body>
</html>
